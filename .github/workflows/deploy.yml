name: 🚌 NoPonto — CI, Publicação e Deploy API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sem workflow_dispatch ou deploy legado; promoção exclusivamente por digest.
permissions:
  contents: read

jobs:
  validate:
    name: CI offline (.NET 9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:9.0-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verifica seleção e avaliador de resultados
        run: python3 -B -m unittest discover -s .ci -p 'test_*.py' -v

      - name: Valida scripts e regressões do deploy com fakes
        run: |
          for script in .deploy/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s .deploy -p 'test_*.py' -v

      - name: Prepara SDK e diretórios descartáveis
        run: |
          docker pull "$SDK_IMAGE"
          echo "sdk=$(docker image inspect --format '{{.Id}}' "$SDK_IMAGE")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/noponto-ci/nuget" "$RUNNER_TEMP/noponto-ci/results" "$RUNNER_TEMP/noponto-ci/home"

      - name: Restore e build sem segredos
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/noponto-ci/nuget:/nuget" \
            --volume "$RUNNER_TEMP/noponto-ci/home:/ci-home" \
            --workdir /workspace --env NUGET_PACKAGES=/nuget \
            --env HOME=/ci-home --env DOTNET_CLI_HOME=/ci-home \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 "$sdk" \
            sh -ec 'sh .ci/check-volume-permissions.sh /nuget /workspace /ci-home && dotnet restore NoPonto/NoPonto.csproj && dotnet build NoPonto/NoPonto.csproj -c Release --no-restore'

      - name: Testes sem acesso à rede externa
        run: |
          filter=$(python3 -B .ci/offline_tests.py filter)
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/noponto-ci/results:/results" \
            --volume "$RUNNER_TEMP/noponto-ci/home:/ci-home" \
            --workdir /workspace \
            --env HOME=/ci-home --env DOTNET_CLI_HOME=/ci-home \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 --env "NOPONTO_TEST_FILTER=$filter" \
            "$sdk" sh -ec 'sh .ci/check-volume-permissions.sh /results /ci-home && sh .ci/test-offline.sh /results'

      - name: Exige resultados aprovados de todas as classes selecionadas
        run: python3 -B .ci/offline_tests.py verify "$RUNNER_TEMP/noponto-ci/results/offline.trx"

  build:
    name: 🐳 Build e Push
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Gera tags de versão
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BASE=ghcr.io/${{ secrets.GHCR_USER }}/noponto-api

          TAGS="${BASE}:latest"
          TAGS="${TAGS},${BASE}:${TIMESTAMP}-${SHORT_SHA}"
          TAGS="${TAGS},${BASE}:build-${{ github.run_number }}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=build-${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build e push
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: ./NoPonto
          file: ./NoPonto/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Resumo
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "## 🚌 NoPonto — imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo "**Versão:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`$PUBLISHED_DIGEST\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy exclusivamente da API
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NOPONTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: noponto-production-api
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Valida requisitos de acesso
        env:
          SERVER_TAILSCALE_IP: ${{ secrets.SERVER_TAILSCALE_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          NOPONTO_DEPLOY_ENV_FILE: ${{ vars.NOPONTO_DEPLOY_ENV_FILE }}
          NOPONTO_DEPLOY_STATE_DIR: ${{ vars.NOPONTO_DEPLOY_STATE_DIR }}
        run: |
          for name in SERVER_TAILSCALE_IP SERVER_USER SERVER_SSH_KEY SERVER_SSH_KNOWN_HOSTS TAILSCALE_OAUTH_CLIENT_ID TAILSCALE_OAUTH_SECRET NOPONTO_DEPLOY_ENV_FILE NOPONTO_DEPLOY_STATE_DIR; do
            if [ -z "${!name}" ]; then echo "Requisito ausente: $name" >&2; exit 1; fi
          done
      - name: Conecta no Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
      - name: Executa artefato versionado via SSH
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_SEQUENCE: ${{ github.run_number }}
          SERVER_TAILSCALE_IP: ${{ secrets.SERVER_TAILSCALE_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          NOPONTO_DEPLOY_ENV_FILE: ${{ vars.NOPONTO_DEPLOY_ENV_FILE }}
          NOPONTO_DEPLOY_STATE_DIR: ${{ vars.NOPONTO_DEPLOY_STATE_DIR }}
        run: bash .deploy/ssh-deploy.sh
